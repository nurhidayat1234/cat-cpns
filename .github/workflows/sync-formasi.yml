name: Sinkronisasi Formasi SSCASN

# Menarik data formasi dari API resmi SSCASN BKN tiap 6 jam, lalu menyimpan
# hasilnya ke data/formasi.json. Situs (GitHub Pages, statis) tidak bisa
# mengambil API itu langsung dari browser karena BKN hanya mengizinkan CORS
# dari sscasn.bkn.go.id — jadi data diambil di sini, di sisi server.
# Dijalankan juga manual dari tab Actions (workflow_dispatch).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ambil data formasi dari API SSCASN
        run: node scripts/fetch-formasi.mjs
      - name: Commit bila ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/formasi.json
          git diff --cached --quiet || git commit -m "Perbarui data formasi SSCASN"
          git push
